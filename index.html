<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jogo da feira de extensão da USP: descubra se o GPS do drone foi enganado comparando a câmera com o satélite."
    />
    <title>Você é o detector</title>
  </head>
  <body>
    <!-- Decoração de fundo, igual aos slides: estrelas grandes e zigue-zagues nos cantos. -->
    <!-- Atributos repetidos aqui (e não só no CSS) para o fundo não virar um
         borrão preto se a página for aberta sem o build. -->
    <svg
      class="backdrop"
      aria-hidden="true"
      focusable="false"
      width="100%"
      height="100%"
      style="position: fixed; inset: 0; z-index: -1"
    >
      <defs>
        <path
          id="star-shape"
          d="M0,-48 L12.3,-17 L45.7,-14.8 L20,6.5 L28.2,38.8 L0,21 L-28.2,38.8 L-20,6.5 L-45.7,-14.8 L-12.3,-17 Z"
        />
      </defs>
      <g class="backdrop__stars" fill="#BFC7CB" stroke="#BFC7CB" stroke-width="10" stroke-linejoin="round">
        <svg x="7%" y="16%" overflow="visible">
          <use href="#star-shape" transform="rotate(-12) scale(1.6)" />
        </svg>
        <svg x="93%" y="22%" overflow="visible">
          <use href="#star-shape" transform="rotate(14) scale(1.2)" />
        </svg>
        <svg x="4%" y="78%" overflow="visible">
          <use href="#star-shape" transform="rotate(8) scale(1.1)" />
        </svg>
        <svg x="88%" y="84%" overflow="visible">
          <use href="#star-shape" transform="rotate(-18) scale(1.9)" />
        </svg>
        <svg x="50%" y="4%" overflow="visible">
          <use href="#star-shape" transform="rotate(20) scale(0.8)" />
        </svg>
        <svg x="56%" y="97%" overflow="visible">
          <use href="#star-shape" transform="rotate(-6) scale(1)" />
        </svg>
      </g>
      <g class="backdrop__zigzags" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="26,70 56,40 86,70 116,40 146,70 176,40" />
        <polyline points="26,110 56,80 86,110 116,80 146,110" />
        <svg x="100%" y="0" overflow="visible">
          <polyline points="-30,150 -60,120 -90,150 -120,120 -150,150 -180,120" />
        </svg>
        <svg x="0" y="100%" overflow="visible">
          <polyline points="30,-130 60,-160 90,-130 120,-160 150,-130" />
        </svg>
        <svg x="100%" y="100%" overflow="visible">
          <polyline points="-26,-60 -56,-30 -86,-60 -116,-30 -146,-60 -176,-30" />
          <polyline points="-26,-100 -56,-70 -86,-100 -116,-70 -146,-100" />
        </svg>
      </g>
    </svg>

    <main id="app" class="app">
      <!-- Substituído pelo jogo assim que o JavaScript carrega. -->
      <p style="max-width: 36em; margin: 3em auto; font: 18px/1.5 system-ui, sans-serif">
        Esta é a página do código-fonte e não abre direto do disco. Para jogar, abra o arquivo
        <strong>dist/index.html</strong> (gerado com <code>npm run build</code>) ou rode
        <code>npm run dev</code>.
      </p>
    </main>

    <noscript>Este jogo precisa de JavaScript ligado.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
